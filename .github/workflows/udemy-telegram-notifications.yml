name: Udemy Telegram Notifications

on:
  schedule:
    - cron: "0 14 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create notification state directory
        run: mkdir -p .udemy-notify-state

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: .udemy-notify-state
          key: udemy-notify-state-${{ github.run_id }}
          restore-keys: |
            udemy-notify-state-

      - name: Send Udemy notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UDEMY_NOTIFY_STATE_FILE: ${{ github.workspace }}/.udemy-notify-state/notified_courses.json
        run: python run_enroller.py --notify-only --discudemy --max-pages 2

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .udemy-notify-state
          key: udemy-notify-state-${{ github.run_id }}
